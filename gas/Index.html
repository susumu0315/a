/* resqmej 受注・発注管理 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --text: #1f2933;
  --muted: #64748b;
  --line: #dde3ea;
  --primary: #1d5fd1;
  --primary-dark: #164aa6;
  --primary-soft: #e7effc;
  --danger: #c62828;
  --ok: #1b8a4a;
  --warn: #b26a00;
  --c-order: #1d5fd1;
  --c-po: #7a4cc2;
  --c-dn: #1b8a4a;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 2px 8px rgba(15, 23, 42, .05);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  font-size: 15px;
  color: var(--text);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); line-height: 1.6; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.45rem; margin: 0; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
h2 { font-size: 1.1rem; margin: 0 0 .9rem; }

/* ---------- layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 230px; flex-shrink: 0; background: #14213d; color: #fff;
  padding: 18px 14px; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none !important; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 9px; background: var(--primary);
  display: grid; place-items: center; font-weight: 800; font-size: 1.2rem;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text small { color: #aab6cf; font-size: .78rem; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
  color: #d6deee; font-weight: 600; text-decoration: none;
}
.nav a:hover { background: rgba(255,255,255,.08); }
.nav a.active { background: rgba(255,255,255,.16); color: #fff; }
.nav-step {
  width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.14);
  display: grid; place-items: center; font-size: .8rem;
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 24px;
  position: sticky; top: 0; z-index: 5;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.search { display: flex; gap: 8px; max-width: 640px; flex: 1; }
.sync { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.search input { flex: 1; }
.view { padding: 24px; max-width: 1280px; width: 100%; }

/* ---------- common parts ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px;
}
.page-head {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  flex-wrap: wrap; margin-bottom: 18px;
}
.crumb { color: var(--muted); font-size: .85rem; margin-bottom: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: .88rem; margin: .3rem 0 0; }
.muted { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.empty .btn { margin-top: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 600;
  cursor: pointer; text-decoration: none !important; white-space: nowrap;
}
.btn:hover { background: #f1f4f8; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-print { background: #0f766e; border-color: #0f766e; color: #fff; font-size: 1.02rem; padding: 10px 20px; }
.btn-print:hover { background: #0b5f58; }
.btn-danger { color: var(--danger); border-color: #efc4c4; }
.btn-danger:hover { background: #fdf0f0; }
.btn-sm { padding: 6px 10px; font-size: .88rem; }
.btn-block { width: 100%; }
.btn-ghost { border-style: dashed; color: var(--primary); }
.icon-btn {
  border: none; background: none; color: var(--muted); cursor: pointer; font-size: 1rem;
  padding: 6px 8px; border-radius: 6px;
}
.icon-btn:hover { background: #fdf0f0; color: var(--danger); }

input, select, textarea {
  font: inherit; color: inherit; width: 100%; padding: 8px 10px;
  border: 1px solid #c9d2dd; border-radius: 7px; background: #fff;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
textarea { min-height: 80px; resize: vertical; }
input.num { text-align: right; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field > label { font-weight: 600; font-size: .9rem; }
.req { color: #fff; background: var(--danger); font-size: .7rem; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
.opt { color: var(--muted); font-weight: 400; font-size: .8rem; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 14px 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.span-2 { grid-column: span 2; }
.span-all { grid-column: 1 / -1; }
.with-btn { display: flex; gap: 6px; }
.with-btn select { flex: 1; }

.number-field input { font-weight: 700; letter-spacing: .02em; }
.number-field.is-order input { border-color: var(--c-order); }
.number-field.is-po input { border-color: var(--c-po); }
.number-field.is-dn input { border-color: var(--c-dn); }

.form-actions {
  display: flex; justify-content: flex-end; gap: 10px; position: sticky; bottom: 0;
  background: rgba(243,245,248,.92); padding: 12px 0; backdrop-filter: blur(4px);
}
.form-actions .btn-primary { min-width: 160px; font-size: 1.02rem; }

.link-info {
  background: var(--primary-soft); border-radius: 8px; padding: 10px 14px; font-size: .9rem;
  display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px;
}
.link-info b { font-weight: 700; }

/* ---------- badges ---------- */
.badge {
  display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 10px;
  border-radius: 999px; white-space: nowrap; vertical-align: middle;
}
.st-new { background: #fff1e0; color: var(--warn); }
.st-po { background: #f1eafb; color: var(--c-po); }
.st-partial { background: #e6f0ff; color: var(--c-order); }
.st-done { background: #e3f5ea; color: var(--ok); }
.st-ng { background: #fdecec; color: var(--danger); }
table.stock input { width: 100px; text-align: right; }
table.stock tfoot th, table.stock tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
.no-tag {
  display: inline-block; font-family: ui-monospace, Consolas, monospace; font-weight: 700;
  font-size: .88rem; padding: 0 6px; border-radius: 4px; white-space: nowrap;
}
.no-tag.is-order { background: #e7effc; color: var(--c-order); }
.no-tag.is-po { background: #f1eafb; color: var(--c-po); }
.no-tag.is-dn { background: #e3f5ea; color: var(--c-dn); }
.no-tag.is-cust { background: #f1f4f8; color: #334155; }

/* ---------- dashboard ---------- */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.step {
  display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: var(--radius);
  border: 2px solid var(--line); background: var(--surface); color: inherit; text-decoration: none !important;
  position: relative;
}
.step:hover { border-color: var(--primary); }
.step-num {
  width: 32px; height: 32px; border-radius: 50%; color: #fff; display: grid; place-items: center;
  font-weight: 800;
}
.step.is-order .step-num { background: var(--c-order); }
.step.is-po .step-num { background: var(--c-po); }
.step.is-dn .step-num { background: var(--c-dn); }
.step b { font-size: 1.05rem; }
.step span:not(.step-num) { color: var(--muted); font-size: .88rem; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); color: inherit; text-decoration: none !important; display: block;
}
.tile:hover { border-color: var(--primary); }
.tile-label { color: var(--muted); font-size: .85rem; font-weight: 600; }
.tile-value { font-size: 1.7rem; font-weight: 800; line-height: 1.3; }
.tile-sub { color: var(--muted); font-size: .82rem; }
.tile.is-alert .tile-value { color: var(--danger); }
.banner {
  background: #fff8e6; border: 1px solid #f3d48a; border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 20px; display: flex; justify-content: space-between;
  align-items: center; gap: 12px; flex-wrap: wrap;
}

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: .92rem; min-width: 640px; }
table.list td.nowrap { white-space: nowrap; }
table.list td.wide { min-width: 10em; }
table.list th, table.list td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.list th { background: #f7f9fb; font-size: .82rem; color: var(--muted); white-space: nowrap; }
table.list tbody tr.clickable { cursor: pointer; }
table.list tbody tr.clickable:hover { background: #f5f8fe; }
table.list td.num, table.list th.num { text-align: right; white-space: nowrap; }
.filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.filters input { max-width: 340px; }
.filters select { width: auto; }
.due-soon { color: var(--danger); font-weight: 700; }

/* ---------- items editor ---------- */
.items-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.items { width: 100%; border-collapse: collapse; min-width: 760px; }
table.items th { background: #f7f9fb; font-size: .82rem; color: var(--muted); padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--line); }
table.items td { padding: 5px 4px; border-bottom: 1px solid #edf1f5; vertical-align: middle; }
table.items input { padding: 6px 8px; }
table.items .c-no { width: 40px; text-align: center; color: var(--muted); }
table.items .c-qty { width: 90px; }
table.items .c-unit { width: 80px; }
table.items .c-price { width: 120px; }
table.items .c-amt { width: 120px; text-align: right; font-weight: 600; padding-right: 10px; }
table.items .c-del { width: 44px; text-align: center; }
table.items .c-name { min-width: 200px; }
table.items .c-color { width: 170px; }
table.items select { padding: 6px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 2px; padding: 4px 6px 4px 4px; border-radius: 999px;
  background: var(--primary-soft); font-weight: 600; font-size: .92rem;
}
.chip button { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0 5px; font: inherit; border-radius: 50%; }
.chip button:disabled { visibility: hidden; }
.chip .chip-del:hover { color: var(--danger); background: #fdf0f0; }
.chip .chip-move:hover { color: var(--primary); background: #fff; }
table.items tr.ref-row td { border-bottom: 1px solid var(--line); padding-top: 0; font-size: .8rem; color: var(--muted); }
table.items tr.ref-row .over { color: var(--danger); font-weight: 700; }
.items-foot { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
table.totals { border-collapse: collapse; min-width: 280px; }
table.totals th, table.totals td { padding: 5px 10px; text-align: right; }
table.totals th { color: var(--muted); font-weight: 600; }
table.totals tr.grand th, table.totals tr.grand td { font-size: 1.15rem; font-weight: 800; color: var(--text); border-top: 2px solid var(--text); }

/* ---------- info ---------- */
dl.info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 18px; margin: 0 0 16px; }
dl.info div { min-width: 0; }
dl.info dt { color: var(--muted); font-size: .8rem; font-weight: 600; }
dl.info dd { margin: 0; font-weight: 600; word-break: break-all; }
.progress { height: 6px; background: #e6ebf1; border-radius: 4px; overflow: hidden; min-width: 60px; }
.progress span { display: block; height: 100%; background: var(--ok); }

/* ---------- chain (紐付け) ---------- */
.chain { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 10px; align-items: stretch; }
.chain-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.chain-label { font-size: .82rem; font-weight: 700; color: var(--muted); }
.chain-arrow { display: grid; place-items: center; color: #9aa7b8; font-size: 1.5rem; font-weight: 700; }
.chain-card {
  display: flex; flex-direction: column; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  border-left-width: 5px; background: #fff; color: inherit; text-decoration: none !important; font-size: .85rem;
}
.chain-card:hover { background: #f7f9fc; }
.chain-card b { font-family: ui-monospace, Consolas, monospace; font-size: .98rem; }
.chain-card span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chain-card.is-order { border-left-color: var(--c-order); }
.chain-card.is-po { border-left-color: var(--c-po); }
.chain-card.is-dn { border-left-color: var(--c-dn); }
.chain-card.is-current { outline: 2px solid var(--primary); }
.chain-empty { font-size: .85rem; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.chain-add {
  font-size: .88rem; font-weight: 700; padding: 8px 12px; border-radius: 8px; border: 1px dashed currentColor; text-align: center;
}
.chain-add.is-po { color: var(--c-po); }
.chain-add.is-dn { color: var(--c-dn); }
.next-step {
  margin-top: 14px; padding: 10px 14px; background: #fff8e6; border-radius: 8px; font-size: .92rem;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
}
.next-step.is-done { background: #e3f5ea; }
.search-result { margin-bottom: 14px; }
.search-result h3 { margin: 0 0 10px; font-size: 1rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- dialog / toast ---------- */
.dialog { border: none; border-radius: 12px; padding: 22px; width: min(620px, 94vw); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.toast-area {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column;
  align-items: center; gap: 8px; z-index: 50; pointer-events: none;
}
.toast {
  background: #14213d; color: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  font-weight: 600; animation: toast-in .2s ease-out;
}
.toast.is-error { background: var(--danger); }
@keyframes toast-in { from { transform: translateY(-10px); opacity: 0; } }

/* ---------- document (発注書・納品書) ---------- */
.paper-scroll { overflow-x: auto; padding-bottom: 10px; }
.paper {
  width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; padding: 14mm 14mm 12mm;
  box-shadow: 0 2px 14px rgba(15, 23, 42, .15); color: #111; font-size: 10pt; line-height: 1.5;
}
.doc-title {
  text-align: center; font-size: 20pt; font-weight: 800; letter-spacing: .5em; padding-left: .5em;
  border-bottom: 3px double #111; padding-bottom: 4px; margin: 0 auto 8mm; width: 70mm;
}
.doc-head { display: flex; justify-content: space-between; gap: 8mm; margin-bottom: 6mm; }
.doc-to { flex: 1.15; }
.doc-from { flex: 1; display: flex; flex-direction: column; gap: 3mm; }
.to-name { font-size: 14pt; font-weight: 700; border-bottom: 1px solid #111; padding-bottom: 2px; }
.to-name span { font-size: 11pt; margin-left: 4px; }
.to-sub { font-size: 9pt; margin-top: 2px; }
.doc-lead { margin: 4mm 0 2mm; }
.doc-subject { display: flex; gap: 8px; border-bottom: 1px solid #999; padding: 1mm 0; margin-bottom: 3mm; }
.doc-subject span { color: #555; min-width: 3em; }
.doc-total {
  display: flex; justify-content: space-between; align-items: baseline; border: 2px solid #111;
  padding: 2mm 4mm; margin-top: 2mm;
}
.doc-total span { font-weight: 700; }
.doc-total b { font-size: 16pt; }
table.doc-meta { border-collapse: collapse; width: 100%; font-size: 9.5pt; }
table.doc-meta th, table.doc-meta td { border: 1px solid #555; padding: 1mm 2mm; }
table.doc-meta th { background: #eef1f5; width: 28mm; text-align: left; font-weight: 600; white-space: nowrap; }
table.doc-meta td { font-family: ui-monospace, Consolas, monospace; font-weight: 700; }
.company { font-size: 9pt; }
.company-name { font-size: 11.5pt; font-weight: 700; }
.company-logo { height: 9mm; display: block; margin-bottom: 1mm; }
.company-dept { font-weight: 700; }
.stamps { display: flex; justify-content: flex-end; gap: 0; }
.stamp { border: 1px solid #555; width: 19mm; text-align: center; font-size: 8pt; }
.stamp + .stamp { border-left: none; }
.stamp div:first-child { border-bottom: 1px solid #555; background: #eef1f5; }
.stamp div:last-child { height: 17mm; }
table.doc-lines { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
table.doc-lines th { background: #e9edf2; border: 1px solid #555; padding: 1.5mm 2mm; font-weight: 700; }
table.doc-lines td { border: 1px solid #777; padding: 1.4mm 2mm; height: 8.2mm; }
table.doc-lines .r { text-align: right; white-space: nowrap; }
table.doc-lines .c { text-align: center; }
table.doc-lines .spec { display: block; font-size: 8pt; color: #444; }
table.doc-lines tr { page-break-inside: avoid; }
.doc-bottom { display: flex; justify-content: space-between; gap: 6mm; margin-top: 3mm; }
.doc-notes { flex: 1; display: flex; flex-direction: column; gap: 2mm; }
table.doc-cond { border-collapse: collapse; width: 100%; font-size: 9pt; }
table.doc-cond th, table.doc-cond td { border: 1px solid #777; padding: 1mm 2mm; }
table.doc-cond th { background: #eef1f5; width: 24mm; text-align: left; font-weight: 600; }
.note-box { border: 1px solid #777; min-height: 20mm; font-size: 9pt; }
.note-label { background: #eef1f5; padding: .5mm 2mm; border-bottom: 1px solid #777; font-weight: 600; }
.note-body { padding: 1.5mm 2mm; white-space: pre-wrap; }
table.doc-sum { border-collapse: collapse; width: 70mm; font-size: 10pt; align-self: flex-start; }
table.doc-sum th, table.doc-sum td { border: 1px solid #555; padding: 1.4mm 2.5mm; }
table.doc-sum th { background: #eef1f5; text-align: left; font-weight: 600; }
table.doc-sum td { text-align: right; }
table.doc-sum tr.grand th, table.doc-sum tr.grand td { font-weight: 800; font-size: 11.5pt; background: #e2e7ee; }
.doc-set .paper + .paper { margin-top: 24px; }
/* 書類の状態：下書き・取消の透かし、再発行の印 */
.paper { position: relative; overflow: hidden; }
.wm {
  position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-28deg);
  font-weight: 800; white-space: nowrap; pointer-events: none; z-index: 2; letter-spacing: .15em;
}
.wm-void { font-size: 110pt; color: rgba(198, 40, 40, .25); border: 8px solid rgba(198, 40, 40, .25); padding: 0 .25em; border-radius: 12px; }
.wm-draft { font-size: 90pt; color: rgba(100, 116, 139, .16); }
.reissue-stamp {
  position: absolute; top: 12mm; right: 14mm; width: 21mm; height: 21mm; border: 2.5px solid #c62828; border-radius: 50%;
  color: #c62828; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; z-index: 3;
}
.reissue-stamp b { font-size: 20pt; }
.reissue-stamp small { font-size: 7pt; font-weight: 700; }
/* 実績 */
.chart-scroll { overflow-x: auto; }
.col-chart { display: block; max-width: 100%; height: auto; }
.col-bar { fill: #2a78d6; }
.col:hover .col-bar { fill: #1d5fd1; }
.col-base { stroke: var(--line); stroke-width: 1; }
.col-val { font-size: 12px; fill: var(--text); font-weight: 600; }
.col-lab { font-size: 12px; fill: var(--muted); }
.share-bars { display: flex; flex-direction: column; gap: 8px; }
.share-row { display: grid; grid-template-columns: var(--share-lab, 12em) minmax(60px, 1fr) auto 3.8em; align-items: center; gap: 10px; font-size: .92rem; }
.share-bars.narrow { --share-lab: 8em; }
.share-lab { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-track { height: 14px; }
.share-bar { display: block; height: 14px; background: #2a78d6; border-radius: 0 4px 4px 0; min-width: 2px; }
.share-row:hover .share-bar { background: #1d5fd1; }
.share-val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.share-pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); flex-shrink: 0; }
table.list.compact th, table.list.compact td { padding-top: 6px; padding-bottom: 6px; }
.analytics-filters label { display: inline-flex; align-items: center; gap: 6px; }
.analytics-2 { align-items: start; }
.inv-note { font-size: 8.5pt; margin: 0; }
.no-tag.is-inv { background: #fdf2e3; color: #9a5b00; }
.no-tag.is-quote { background: #e2f3f5; color: #0e6b78; }
.number-field.is-quote .number-pending { border-color: #0e6b78; }
table.doc-lines tr.grp td { background: #f3f5f8; font-weight: 700; font-size: 9pt; padding: 1mm 2mm; height: auto; }
.rule-title { margin: 18px 0 8px; font-size: 1rem; border-top: 1px solid var(--line); padding-top: 14px; }
.price-rows { display: flex; flex-direction: column; gap: 6px; }
.price-row { display: flex; align-items: center; gap: 8px; font-weight: 400; }
.price-row span { min-width: 9em; }
.price-row input { max-width: 140px; }
#partner-dialog { max-height: 92vh; overflow-y: auto; }
.no-tag.is-draft { background: #eef1f5; color: var(--muted); }
.no-tag.is-void { text-decoration: line-through; opacity: .7; }
.re-mark {
  display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; margin-left: 4px; border: 1.5px solid var(--danger);
  border-radius: 50%; color: var(--danger); font-size: .78rem; font-weight: 800; vertical-align: middle;
}
.chain-card.is-void-card, tr.is-void-row { opacity: .6; }
.state-banner { border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.state-banner.is-draft { background: #fff7e6; border: 1px solid #f3d29b; }
.state-banner.is-issued { background: #e9f7ef; border: 1px solid #b7e2c7; }
.state-banner.is-void { background: #fdecec; border: 1px solid #f3b4b4; }
.number-pending { padding: 9px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-weight: 600; }
table.set-status th { width: 7em; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
label.check input { width: auto; }
.paper[hidden] { display: none; }
.set-toggles label { cursor: pointer; }
.set-toggles input { width: auto; margin: 0 4px 0 0; }
/* 領収書 */
.rc-amount {
  display: flex; align-items: baseline; justify-content: center; gap: 6mm; margin: 6mm auto 4mm; width: 130mm;
  border-bottom: 3px double #111; padding-bottom: 2mm;
}
.rc-amount span { font-weight: 700; font-size: 12pt; }
.rc-amount b { font-size: 24pt; letter-spacing: .05em; }
.rc-for { text-align: center; margin: 0 0 8mm; line-height: 2; }
.rc-bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 6mm; }
.rc-from { display: flex; flex-direction: column; gap: 3mm; min-width: 70mm; }
.revenue-stamp {
  width: 24mm; height: 28mm; border: 1px dashed #555; display: grid; place-items: center;
  text-align: center; font-size: 9pt; color: #555;
}
.receipt { display: flex; justify-content: flex-end; margin-top: 6mm; }
.receipt-box { border: 1px solid #555; display: flex; font-size: 9pt; }
.receipt-box > div:first-child { writing-mode: vertical-rl; background: #eef1f5; border-right: 1px solid #555; padding: 2mm 1mm; letter-spacing: .3em; }
.receipt-box > div:last-child { width: 26mm; height: 26mm; }
.receipt-msg { font-size: 8.5pt; margin-right: 4mm; align-self: flex-end; }

/* ---------- responsive ---------- */
.tiles.tiles-3 { grid-template-columns: repeat(3, 1fr); }
/* 納期の警告 */
.alerts { padding: 0 24px; max-width: 1280px; width: 100%; }
.alert-bar {
  margin-top: 16px; background: #fdecec; border: 1px solid #f3b4b4; border-left: 5px solid var(--danger);
  border-radius: var(--radius); padding: 10px 14px; color: var(--danger);
}
.alert-bar summary { cursor: pointer; font-weight: 600; }
.alert-bar summary .muted { font-weight: 400; margin-left: 6px; font-size: .85rem; }
.alert-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alert-list a { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--text); padding: 6px 8px; border-radius: 8px; background: #fff; }
.alert-list a:hover { text-decoration: none; background: var(--primary-soft); }
.alert-dialog { max-width: 760px; }
.alert-dialog h2 { color: var(--danger); }
@media (max-width: 1000px) {
  .tiles, .tiles.tiles-3 { grid-template-columns: repeat(2, 1fr); }
  dl.info { grid-template-columns: repeat(2, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .share-row { grid-template-columns: 7em 1fr auto; }
  .share-pct { display: none; }
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; padding: 12px 16px; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav a { padding: 8px 10px; white-space: nowrap; }
  .nav-step { display: none; }
  .topbar { padding: 10px 16px; position: static; }
  .view { padding: 16px; }
  .alerts { padding: 0 16px; }
  .steps, .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .chain { grid-template-columns: 1fr; }
  .chain-arrow { transform: rotate(90deg); }
}

/* ---------- print ---------- */
@page { size: A4; margin: 10mm; }
@media print {
  body { background: #fff; }
  .sidebar, .topbar, .no-print, .toast-area { display: none !important; }
  .app, .main { display: block; }
  .view { padding: 0; max-width: none; }
  .paper-scroll { overflow: visible; padding: 0; }
  .paper { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
  .doc-set .paper + .paper { margin-top: 0; }
  .paper.page-break { break-before: page; }
  .reissue-stamp { top: 0; right: 0; }
  .paper[hidden] { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">R</span>
        <span class="brand-text"><b>resqmej</b><small>受注・発注管理</small></span>
      </a>
      <a class="btn btn-primary btn-block new-order" href="#/orders/new">＋ 新しい受注を登録</a>
      <nav class="nav">
        <a href="#/" data-nav="home"><span class="nav-step">⌂</span>ホーム</a>
        <a href="#/orders" data-nav="orders"><span class="nav-step">1</span>受注</a>
        <a href="#/pos" data-nav="pos"><span class="nav-step">2</span>発注書</a>
        <a href="#/deliveries" data-nav="deliveries"><span class="nav-step">3</span>納品書</a>
        <a href="#/bills" data-nav="bills"><span class="nav-step">4</span>請求書</a>
        <a href="#/analytics" data-nav="analytics"><span class="nav-step">↗</span>実績</a>
        <a href="#/stock" data-nav="stock"><span class="nav-step">▦</span>在庫</a>
        <a href="#/prospects" data-nav="prospects"><span class="nav-step">☆</span>見込み案件</a>
        <a href="#/quotes" data-nav="quotes"><span class="nav-step">✎</span>見積書</a>
        <a href="#/partners" data-nav="partners"><span class="nav-step">◎</span>取引先</a>
        <a href="#/masters" data-nav="masters"><span class="nav-step">▤</span>商品・色・担当</a>
        <a href="#/settings" data-nav="settings"><span class="nav-step">⚙</span>設定</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <form class="search" id="global-search" role="search">
          <input type="search" name="q" placeholder="番号・会社名で検索（例：JO-2026-0001 / お客様の発注番号）" autocomplete="off">
          <button class="btn" type="submit">検索</button>
        </form>
        <span id="sync" class="sync"></span>
      </header>
      <div id="alerts" class="alerts no-print"></div>
      <main id="view" class="view"></main>
    </div>
  </div>

  <dialog id="partner-dialog" class="dialog">
    <form method="dialog" id="partner-form">
      <h2 id="partner-dialog-title">取引先を登録</h2>
      <div class="grid-2">
        <div class="field span-2">
          <label>会社名・氏名 <span class="req">必須</span></label>
          <input name="name" required placeholder="例：株式会社〇〇">
        </div>
        <div class="field">
          <label>区分</label>
          <select name="kind">
            <option value="customer">顧客（受注先・納品先）</option>
            <option value="supplier">仕入先（発注先）</option>
            <option value="both">顧客・仕入先の両方</option>
          </select>
        </div>
        <div class="field">
          <label>敬称</label>
          <select name="honorific">
            <option value="御中">御中（会社宛）</option>
            <option value="様">様（個人宛）</option>
          </select>
        </div>
        <div class="field">
          <label>郵便番号</label>
          <input name="zip" placeholder="例：100-0001">
        </div>
        <div class="field">
          <label>電話番号</label>
          <input name="tel" placeholder="例：03-0000-0000">
        </div>
        <div class="field span-2">
          <label>住所</label>
          <input name="address" placeholder="例：東京都千代田区…">
        </div>
        <div class="field span-2">
          <label>ご担当者（書類の宛名下に表示）</label>
          <input name="contact" placeholder="例：購買部 山田様">
        </div>
      </div>
      <h3 class="rule-title">請求書のルール <span class="opt">（お客様の場合に使います）</span></h3>
      <div class="grid-2" id="rule-fields"></div>
      <div class="dialog-actions">
        <button type="button" class="btn" data-act="cancel">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存する</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast-area" aria-live="polite"></div>

  <datalist id="units">
    <option value="個"><option value="本"><option value="枚"><option value="式"><option value="台">
    <option value="箱"><option value="セット"><option value="kg"><option value="m"><option value="時間"><option value="件">
  </datalist>

// ---------- utilities ----------
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const toNum = v => (v === '' || v == null || isNaN(Number(v)) ? 0 : Number(v));
const num = v => toNum(v).toLocaleString('ja-JP', { maximumFractionDigits: 2 });
const yen = v => '¥' + Math.round(toNum(v)).toLocaleString('ja-JP');
const clone = o => JSON.parse(JSON.stringify(o));

function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const today = () => ymd(new Date());
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function daysUntil(s) { return Math.round((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000); }
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${y}年${+m}月${+d}日`;
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' is-error' : '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function download(filename, content, mime) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    orders: [],
    pos: [],
    deliveries: [],
    receipts: [], // 入庫記録
    prospects: [], // 見込み案件
    logs: [], // 書類の発行・取消の操作履歴
    bills: [], // 請求書（1 件以上の納品書をまとめる）
    salesReports: [], // 販売実績表の出荷実績（月・色ごと）
    quotes: [], // 見積書
  };
}

function normalize(d) {
  const def = defaultData();
  const s = d.settings || {};
  let company = { ...def.settings.company, ...(s.company || {}) };
  // 旧版で自社情報が未登録（またはサンプルのまま）なら初期値の自社情報に置き換える
  if ((d.version || 1) < 2 && (!company.name || company.name === SAMPLE_COMPANY_NAME)) company = { ...COMPANY_DEFAULT };
  // 旧版のデータには、まだ登録されていない初期の取引先だけを追加する
  const partners = d.partners || [];
  if ((d.version || 1) < 3) {
    PARTNERS_DEFAULT.forEach(p => { if (!partners.some(x => x.name === p.name)) partners.push({ id: uid(), ...p }); });
  }
  // 請求書のルールがない取引先には、初期値（既存の取引先は要件定義書の条件）を設定する
  partners.forEach(x => {
    if (!x.billing) x.billing = { ...ruleDefaults(), ...rulePreset(x.name) };
    else if ((d.version || 1) < 8) x.billing = { ...x.billing, ...rulePresetV8(x.name) };
  });
  if ((d.version || 1) < 8) {
    if (!company.invoiceNo) company.invoiceNo = COMPANY_DEFAULT.invoiceNo;
    if (!s.bankAccount) s.bankAccount = BANK_DEFAULT;
  }
  const colors = d.colors || def.colors;
  if ((d.version || 1) < 5 && !colors.includes('アソート')) colors.push('アソート');
  return {
    ...def,
    ...d,
    partners,
    products: d.products || def.products,
    colors,
    staff: d.staff || def.staff,
    stock: { opening: {}, reorder: {}, ...(d.stock || {}) },
    version: def.version,
    settings: {
      ...def.settings,
      ...s,
      company,
      prefix: { ...def.settings.prefix, ...(s.prefix || {}) },
    },
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {
    console.error(e);
  }
  return defaultData();
}

let db = REMOTE ? defaultData() : load();

// ---------- スプレッドシートとの同期（Apps Script 配信時のみ） ----------
// レコードを持つ一覧と、1 件だけの設定値。スプレッドシートではそれぞれ 1 シートになる
const COLLS = ['partners', 'products', 'orders', 'pos', 'deliveries', 'receipts', 'prospects', 'logs', 'bills', 'salesReports', 'quotes'];
const CONFIG_KEYS = ['version', 'settings', 'colors', 'staff', 'stock'];
let synced = {}; // 最後にサーバーと一致していた内容 { 一覧: { id: JSON } }
let revs = {}; // サーバー側の版 { 一覧: { id: rev } }。他の人の更新との衝突検知に使う
let saveQueue = Promise.resolve();
let pending = 0;
let generation = 0;
let currentUser = '';

const callServer = (fn, arg) => new Promise((resolve, reject) => {
  google.script.run
    .withSuccessHandler(r => resolve(JSON.parse(r)))
    .withFailureHandler(reject)[fn](JSON.stringify(arg ?? null));
});

function snapshot(d) {
  const out = { config: {} };
  CONFIG_KEYS.forEach(k => { if (d[k] !== undefined) out.config[k] = JSON.stringify(d[k]); });
  COLLS.forEach(c => { out[c] = Object.fromEntries((d[c] || []).map(r => [r.id, JSON.stringify(r)])); });
  return out;
}

// スプレッドシートで見たときに内容がわかるように付ける説明
function recordLabel(coll, id, r) {
  const items = r.items ? r.items.map(it => `${it.name}${it.spec ? `（${it.spec}）` : ''}×${it.qty}`).join('、') : '';
  switch (coll) {
    case 'orders': return `${r.orderNo}｜${r.orderDate}｜${partnerName(r.customerId)}｜${items}`;
    case 'pos': return `${r.poNo || '下書き'}｜${DOC_STATE[stateOf(r)].label}｜${r.poDate}｜${partnerName(r.supplierId)}｜${items}`;
    case 'deliveries': return `${r.dnNo || '下書き'}｜${DOC_STATE[stateOf(r)].label}｜${r.deliveryDate}｜${partnerName(getOrder(r.orderId)?.customerId)}｜${items}`;
    case 'bills': return `${r.billNo || '下書き'}｜${DOC_STATE[stateOf(r)].label}｜${r.invoiceDate}｜${partnerName(r.partnerId)}｜納品書 ${r.dnIds.length} 件`;
    case 'salesReports': return `${r.month}｜${partnerName(r.partnerId)}｜${r.color}｜出荷実績 ${r.shipped}`;
    case 'quotes': return `${r.quoteNo || '下書き'}｜${DOC_STATE[stateOf(r)].label}｜${r.quoteDate}｜${partnerName(r.partnerId)}｜${items}`;
    case 'logs': return `${r.at}｜${r.action}｜${DOC_TITLE[r.docType] || ''} ${r.no}｜${r.by}${r.reason ? '｜' + r.reason : ''}`;
    case 'receipts': return `${r.date}｜${r.color}｜${r.qty}`;
    case 'prospects': return `${r.date}｜${r.company}｜${r.product}｜${r.color || ''}×${r.qty}`;
    case 'config': return id;
    default: return r.name || id;
  }
}

function setSync(text) {
  const el = $('#sync');
  if (el) el.textContent = text ?? (pending ? '保存中…' : `✓ 保存済み${currentUser ? '（' + currentUser + '）' : ''}`);
}

let saveCount = 0;
function save() {
  saveCount++;
  if (!REMOTE) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(db));
    } catch (e) {
      alert('保存に失敗しました：' + e.message);
    }
    return;
  }
  // 前回から変わったレコードだけをサーバーへ送る
  const cur = snapshot(db);
  const ops = [];
  Object.entries(cur).forEach(([coll, recs]) => Object.entries(recs).forEach(([id, json]) => {
    if (synced[coll]?.[id] !== json) ops.push({ coll, id, data: JSON.parse(json), label: recordLabel(coll, id, JSON.parse(json)) });
  }));
  Object.entries(synced).forEach(([coll, recs]) => Object.keys(recs).forEach(id => {
    if (!(id in (cur[coll] || {}))) ops.push({ coll, id, del: true });
  }));
  synced = cur;
  if (ops.length) pushOps(ops);
}

function pushOps(ops) {
  const gen = generation;
  pending++;
  setSync();
  saveQueue = saveQueue.then(async () => {
    if (gen !== generation) return; // 読み込み直した後は古い変更を送らない
    ops.forEach(op => { op.baseRev = revs[op.coll]?.[op.id] || ''; });
    const res = await callServer('apiSave', { ops });
    if (!res.ok) throw new Error(res.message);
    res.revs.forEach(({ coll, id, rev }) => {
      revs[coll] = revs[coll] || {};
      if (rev) revs[coll][id] = rev;
      else delete revs[coll][id];
    });
  }).catch(async err => {
    alert(`保存できませんでした。\n${err.message || err}\n\n最新の内容を読み込み直します。`);
    try { await reload(); } catch (e) { console.error(e); }
    route();
  }).finally(() => {
    pending--;
    setSync();
  });
}

// 戻り値：データを置き換えたら true。
// keepSame：内容が今と同じなら今のデータ（オブジェクト）をそのまま使う。画面のボタンが持っているレコードが古くならない
// apply：読み込み中に操作があったときなど、取り込まないときは false を返す関数
async function reload({ keepSame = false, apply } = {}) {
  const res = await callServer('apiLoad');
  if (apply && !apply()) return false;
  const nextRevs = {};
  const raw = {};
  Object.entries(res.data).forEach(([coll, list]) => {
    nextRevs[coll] = Object.fromEntries(list.map(r => [r.id, r.rev]));
    if (coll === 'config') list.forEach(r => { raw[r.id] = r.data; });
    else raw[coll] = list.map(r => r.data);
  });
  const empty = !res.data.config?.length;
  const next = empty ? defaultData() : normalize(clone(raw));
  currentUser = res.user || '';
  revs = nextRevs;
  synced = empty ? {} : snapshot(raw);
  if (keepSame && !empty && JSON.stringify(snapshot(next)) === JSON.stringify(snapshot(db))) {
    save(); // スプレッドシートの内容と、補完した今のデータとの違いがあれば書き込む
    setSync();
    return false;
  }
  generation++;
  db = next;
  migrateIssued();
  save(); // 空のスプレッドシートには初期データを、旧版のデータには移行結果を書き込む
  setSync();
  return true;
}

// バックアップからの復元・全削除：スプレッドシートの内容をまるごと置き換える
async function replaceAll(next) {
  if (!REMOTE) {
    db = next;
    migrateIssued();
    save();
    return;
  }
  await saveQueue;
  const data = {};
  Object.entries(snapshot(next)).forEach(([coll, recs]) => {
    data[coll] = Object.entries(recs).map(([id, json]) => ({ id, data: JSON.parse(json), label: '' }));
  });
  // 説明文の取引先名を新しいデータから引くため一時的に差し替え、サーバーが受け付けるまでは元に戻しておく
  const prev = db;
  db = next;
  Object.entries(data).forEach(([coll, list]) => list.forEach(r => { r.label = recordLabel(coll, r.id, r.data); }));
  db = prev;
  const res = await callServer('apiReplaceAll', { data });
  if (!res.ok) throw new Error(res.message);
  await reload();
}

// 他の人の変更を取り込む（入力中の画面では行わない）
const isIdle = () => REMOTE && !pending && !document.hidden && !document.querySelector('dialog[open]') &&
  !/[/?](new|edit)\b|^#\/(masters|settings)/.test(location.hash) && !document.activeElement?.matches('input, textarea, select');
async function refreshIfIdle() {
  if (!isIdle()) return;
  const saves = saveCount;
  let changed;
  // 読み込み中に保存や入力があったら、読み込んだ内容（保存より前のもの）は取り込まない
  try { changed = await reload({ keepSame: true, apply: () => isIdle() && saveCount === saves }); } catch (e) { return console.error(e); }
  if (changed) {
    const y = window.scrollY;
    route();
    window.scrollTo(0, y);
  }
}

const NO_FIELD = { order: 'orderNo', po: 'poNo', dn: 'dnNo', bill: 'billNo', quote: 'quoteNo' };
const listOf = kind => ({ order: db.orders, po: db.pos, dn: db.deliveries, bill: db.bills, quote: db.quotes }[kind]);

// 「接頭辞-西暦-連番」で次の番号を採番（例：JO-2026-0001）
function nextNo(kind) {
  const prefix = db.settings.prefix[kind === 'bill' ? 'inv' : kind] || kind.toUpperCase();
  const year = new Date().getFullYear();
  const re = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '-' + year + '-(\\d+)$');
  let max = 0;
  listOf(kind).forEach(x => {
    const m = re.exec(x[NO_FIELD[kind]]);
    if (m) max = Math.max(max, +m[1]);
  });
  return `${prefix}-${year}-${String(max + 1).padStart(4, '0')}`;
}

const getOrder = id => db.orders.find(o => o.id === id);
const getPo = id => db.pos.find(p => p.id === id);
const getDn = id => db.deliveries.find(d => d.id === id);
const getQuote = id => db.quotes.find(q => q.id === id);
const getPartner = id => db.partners.find(p => p.id === id);
const partnerName = id => getPartner(id)?.name || '（未設定）';
const posOf = orderId => db.pos.filter(p => p.orderId === orderId).sort(byField('poNo'));
const dnsOf = orderId => db.deliveries.filter(d => d.orderId === orderId).sort(byField('dnNo'));

function byField(f, desc = false) {
  return (a, b) => (desc ? -1 : 1) * String(a[f] || '').localeCompare(String(b[f] || ''), 'ja', { numeric: true });
}
function byDateNoDesc(dateF, noF) {
  return (a, b) => String(b[dateF] || '').localeCompare(String(a[dateF] || '')) || byField(noF, true)(a, b);
}

const lineAmount = it => Math.round(toNum(it.qty) * toNum(it.price));
const noPriceLine = it => !!toNum(it.qty) && (it.price === '' || it.price == null);
function calc(doc) {
  const sub = (doc.items || []).reduce((s, it) => s + lineAmount(it), 0);
  const rate = doc.taxRate ?? db.settings.taxRate;
  const tax = Math.floor(sub * toNum(rate) / 100);
  return { sub, tax, total: sub + tax, rate };
}

// 受注明細ごとの納品済数量 { 明細id: 数量 }。発行済の納品書だけを数える（withDrafts のときは下書きも）
function deliveredMap(orderId, excludeDnId, withDrafts = false) {
  const map = {};
  dnsOf(orderId).forEach(d => {
    if (d.id === excludeDnId || !(stateOf(d) === 'issued' || (withDrafts && stateOf(d) === 'draft'))) return;
    d.items.forEach(it => { if (it.ref) map[it.ref] = (map[it.ref] || 0) + toNum(it.qty); });
  });
  return map;
}

function orderStatus(o) {
  const items = o.items.filter(it => toNum(it.qty) > 0);
  const dmap = deliveredMap(o.id);
  const any = Object.values(dmap).some(v => v > 0);
  const all = items.length > 0 && items.every(it => (dmap[it.id] || 0) >= toNum(it.qty));
  const key = all ? 'done' : any ? 'partial' : posOf(o.id).some(isLive) ? 'po' : 'new';
  return { key, ...STATUS[key] };
}

// 回答納期があればそれを、なければ希望納期を納期として扱う
const dueOf = o => o.answerDate || o.dueDate || '';
const billingBadge = b => (b ? `<span class="badge ${BILLING[b] || ''}">${esc(b)}</span>` : '<span class="muted">—</span>');
const leftText = n => (n < 0 ? `${-n}日超過` : n === 0 ? '本日' : `あと${n}日`);

// 納期が近い（または過ぎた）未完了の受注と、その受注のための発注書
function dueAlerts() {
  const days = toNum(db.settings.dueWarnDays);
  const list = [];
  const open = new Map(db.orders.map(o => [o.id, orderStatus(o).key !== 'done']));
  db.orders.forEach(o => {
    const due = dueOf(o);
    if (!due || !open.get(o.id) || daysUntil(due) > days) return;
    list.push({ kind: '受注', cls: 'is-order', no: o.orderNo, name: partnerName(o.customerId), what: itemsSummary(o.items), due, left: daysUntil(due), href: `#/orders/${o.id}` });
  });
  db.pos.forEach(p => {
    if (!p.dueDate || !isLive(p) || !open.get(p.orderId) || daysUntil(p.dueDate) > days) return;
    list.push({ kind: '発注書', cls: 'is-po', no: p.poNo || '下書き', name: partnerName(p.supplierId), what: '仕入先からの納期', due: p.dueDate, left: daysUntil(p.dueDate), href: `#/pos/${p.id}` });
  });
  return list.sort((a, b) => a.left - b.left);
}

function dueAlertsListHTML(list) {
  return `<ul class="alert-list">${list.map(x => `<li><a href="${x.href}">
    <span class="badge ${x.left < 0 ? 'st-ng' : 'st-new'}">${x.left < 0 ? '超過' : '間近'}</span>
    <span class="muted">${x.kind}</span> ${tag(x.no, x.cls)} <b>${esc(x.name)}</b> <span class="muted">${esc(x.what)}</span>
    <span class="due-soon">${esc(x.due)}（${leftText(x.left)}）</span></a></li>`).join('')}</ul>`;
}

// 画面上部の警告（どの画面にも表示）
let alertOpen = false;
function renderAlerts() {
  const el = $('#alerts');
  if (!el) return;
  const list = dueAlerts();
  const over = list.filter(x => x.left < 0).length;
  el.innerHTML = list.length ? `<details class="alert-bar" ${alertOpen ? 'open' : ''}>
    <summary>⚠ 納期が近い・過ぎている案件が <b>${list.length} 件</b> あります${over ? `（うち <b>${over} 件は納期超過</b>）` : ''}
      <span class="muted">納期まで ${num(db.settings.dueWarnDays)} 日以内 ／ 押すと一覧を表示</span></summary>
    ${dueAlertsListHTML(list)}</details>` : '';
  $('details', el)?.addEventListener('toggle', e => { alertOpen = e.target.open; });
}

// 起動したときに 1 日 1 回、納期の警告をポップアップで表示する
function popupAlerts() {
  const list = dueAlerts();
  if (!list.length) return;
  const key = 'resqmej-due-alert-' + today();
  try {
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, '1');
  } catch (e) { /* 保存できない環境では毎回表示する */ }
  const dlg = document.createElement('dialog');
  dlg.className = 'dialog alert-dialog';
  dlg.innerHTML = `<h2>⚠ 納期の確認</h2>
    <p>納期が近い（${num(db.settings.dueWarnDays)} 日以内）、または過ぎている案件が <b>${list.length} 件</b> あります。</p>
    ${dueAlertsListHTML(list)}
    <div class="dialog-actions"><button class="btn btn-primary" type="button">確認しました</button></div>`;
  document.body.appendChild(dlg);
  dlg.addEventListener('click', e => { if (e.target.closest('a, button')) dlg.close(); });
  dlg.addEventListener('close', () => dlg.remove());
  dlg.showModal();
}

// 色別在庫：現在庫＝期首在庫＋入庫累計－出荷済（納品書）／有効在庫＝現在庫－引当（受注のうち未納品の数量）
function stockRows(excludeDnId) {
  const z = () => ({ received: 0, shipped: 0, allocated: 0 });
  const map = {};
  const at = c => (map[c] = map[c] || z());
  db.colors.forEach(at);
  db.receipts.forEach(r => { at(r.color).received += toNum(r.qty); });
  db.deliveries.forEach(d => {
    if (d.id === excludeDnId || stateOf(d) !== 'issued') return;
    d.items.forEach(it => { if (it.spec) at(it.spec).shipped += toNum(it.qty); });
  });
  db.orders.forEach(o => {
    const dmap = deliveredMap(o.id, excludeDnId);
    o.items.forEach(it => {
      const rest = toNum(it.qty) - (dmap[it.id] || 0);
      if (it.spec && rest > 0) at(it.spec).allocated += rest;
    });
  });
  Object.keys(db.stock.opening).forEach(at);
  return Object.entries(map).map(([color, v]) => {
    const opening = toNum(db.stock.opening[color]);
    const reorder = toNum(db.stock.reorder[color]);
    const current = opening + v.received - v.shipped;
    const available = current - v.allocated;
    const judge = available < 0 ? '在庫不足' : available <= reorder ? '要発注' : 'OK';
    return { color, opening, ...v, current, available, reorder, judge };
  });
}

const badge = st => `<span class="badge ${st.cls}">${st.label}</span>`;
const tag = (no, cls) => (no ? `<span class="no-tag ${cls}">${esc(no)}</span>` : '<span class="muted">—</span>');
const findProduct = name => db.products.find(p => p.name === name);

// 新しい明細行。品名はマスタの先頭の商品（レスキューミー）を初期選択する
function blankItem(withPrice = false, priceOf) {
  const p = db.products[0];
  return { id: uid(), name: p?.name || '', spec: '', qty: 1, unit: p?.unit || '個', price: withPrice && p ? (priceOf ? priceOf(p.name) : p.price) : '' };
}

// 色を使う商品で色が未選択の行があればエラーメッセージを返す
function itemsError(items) {
  const i = items.findIndex(it => findProduct(it.name)?.useColor && !it.spec);
  return i < 0 ? '' : `${i + 1}行目の色を選択してください`;
}

function productOptions(selected) {
  const names = db.products.map(p => p.name);
  if (selected && !names.includes(selected)) names.push(selected);
  return (selected ? '' : '<option value="">— 品名を選択 —</option>') +
    names.map(n => `<option ${n === selected ? 'selected' : ''}>${esc(n)}</option>`).join('');
}

function colorOptions(selected) {
  const list = [...db.colors];
  if (selected && !list.includes(selected)) list.push(selected);
  return '<option value="">— 色を選択 —</option>' +
    list.map(c => `<option ${c === selected ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

function cleanItems(items) {
  return items
    .filter(it => String(it.name || '').trim())
    .map(it => ({ ...it, name: it.name.trim(), spec: (it.spec || '').trim(), qty: toNum(it.qty), price: it.price === '' ? '' : toNum(it.price) }));
}

// 受注明細のうち、まだ納品していない分を納品書の明細にする
function remainingItems(order, excludeDnId) {
  const dmap = deliveredMap(order.id, excludeDnId, true);
  return order.items
    .map(it => ({ it, rest: toNum(it.qty) - (dmap[it.id] || 0) }))
    .filter(x => x.rest > 0)
    .map(({ it, rest }) => ({ id: uid(), ref: it.id, name: it.name, spec: it.spec, qty: rest, unit: it.unit, price: it.price }));
}

  [/^\/pos\/([^/]+)$/, m => viewDocDetail('po', m[1])],
  [/^\/deliveries$/, () => viewDocList('dn')],
  [/^\/deliveries\/new$/, (m, q) => viewDnForm(null, q.get('order'))],
  [/^\/deliveries\/([^/]+)\/edit$/, m => viewDnForm(m[1])],
  [/^\/deliveries\/([^/]+)\/(set|bill)$/, m => openBillFor(m[1])],
  [/^\/bills$/, viewBills],
  [/^\/bills\/([^/]+)$/, m => viewBillDetail(m[1])],
  [/^\/deliveries\/([^/]+)$/, m => viewDocDetail('dn', m[1])],
  [/^\/partners$/, viewPartners],
  [/^\/partners\/([^/]+)$/, m => viewPartnerDetail(m[1])],
  [/^\/stock$/, viewStock],
  [/^\/analytics$/, (m, q) => viewAnalytics(q)],
  [/^\/prospects$/, (m, q) => viewProspects(q.get('edit'))],
  [/^\/masters$/, viewMasters],
  [/^\/settings$/, viewSettings],
  [/^\/search$/, (m, q) => viewSearch(q.get('q') || '')],
];

function route() {
  const h = location.hash.slice(1) || '/';
  const i = h.indexOf('?');
  const path = i < 0 ? h : h.slice(0, i);
  const q = new URLSearchParams(i < 0 ? '' : h.slice(i + 1));
  document.title = APP_TITLE;
  const section = path.split('/')[1] || 'home';
  $$('.nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === section));
  for (const [re, fn] of routes) {
    const m = path.match(re);
    if (m) {
      fn(m, q);
      renderAlerts();
      window.scrollTo(0, 0);
      return;
    }
  }
  location.hash = '#/';
}

function partnerOptions(kind, selected) {
  const main = [];
  const other = [];
  [...db.partners].sort(byField('name')).forEach(p => (p.kind === kind || p.kind === 'both' ? main : other).push(p));
  const opts = list => list.map(p => `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  return `<option value="">— 選択してください —</option>` +
    (other.length ? `<optgroup label="${KIND_LABEL[kind]}">${opts(main)}</optgroup><optgroup label="その他の取引先">${opts(other)}</optgroup>` : opts(main));
}

    btn.addEventListener('click', async () => {

      if (p) form.elements[btn.dataset.target].innerHTML = partnerOptions(kind, p.id);
    });

function openPartnerDialog(partner, kind) {
  return new Promise(resolve => {
    const dlg = $('#partner-dialog');
    const form = $('#partner-form');
    form.reset();
    const data = partner || { kind: kind || 'customer', honorific: '御中' };
    for (const el of form.elements) if (el.name && data[el.name] != null) el.value = data[el.name];
    $('#partner-dialog-title').textContent = partner ? '取引先を編集' : '取引先を登録';
    const rules = $('#rule-fields');
    rules.innerHTML = ruleFieldsHTML(partner);
    bindRuleFields(rules);

    let done = false;
    const finish = v => {
      if (done) return;
      done = true;
      form.onsubmit = null;
      dlg.onclose = null;
      resolve(v);
    };
    form.onsubmit = e => {
      e.preventDefault();
      const all = Object.fromEntries(new FormData(form));
      const f = Object.fromEntries(['name', 'kind', 'honorific', 'zip', 'tel', 'address', 'contact'].map(k => [k, all[k] ?? '']));
      f.name = f.name.trim();
      if (!f.name) return toast('会社名・氏名を入力してください', 'error');
      const billing = readRuleFields(rules, all);
      if (all.r_shipOn === 'on' && !billing.shipping) return toast('送料の金額を入力してください', 'error');
      let rec;
      if (partner) rec = Object.assign(partner, f, { billing });
      else db.partners.push(rec = { id: uid(), ...f, billing });
      save();
      toast('取引先を保存しました');
      finish(rec);
      dlg.close();
    };
    dlg.onclose = () => finish(null);
    $('[data-act=cancel]', form).onclick = () => dlg.close();
    dlg.showModal();
    form.elements.name.focus();
  });
}

// 明細入力（行の追加・削除・金額の自動計算）
function mountItems(root, initialItems, { getRate, refInfo, autoPrice = false, priceOf } = {}) {
  let items = initialItems;
  root.innerHTML = `
    <div class="items-wrap">
      <table class="items">
        <thead><tr>
          <th class="c-no">No.</th><th class="c-name">品名</th><th class="c-color">色</th>
          <th class="c-qty">数量</th><th class="c-unit">単位</th><th class="c-price">単価（税抜）</th>
          <th class="c-amt">金額</th><th class="c-del"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="items-foot">
      <button type="button" class="btn btn-ghost" data-act="add-row">＋ 明細行を追加</button>
      <table class="totals"><tbody></tbody></table>
    </div>`;
  const tbody = $('table.items tbody', root);

  const updateTotals = () => {
    const t = calc({ items, taxRate: toNum(getRate ? getRate() : db.settings.taxRate) });
    $('table.totals tbody', root).innerHTML = `
      <tr><th>小計</th><td>${yen(t.sub)}</td></tr>
      <tr><th>消費税（${num(t.rate)}%）</th><td>${yen(t.tax)}</td></tr>
      <tr class="grand"><th>合計（税込）</th><td>${yen(t.total)}</td></tr>`;
  };

  const renderRows = () => {
    tbody.innerHTML = items.map((it, i) => `
      <tr data-i="${i}">
        <td class="c-no">${i + 1}</td>
        <td><select data-f="name">${productOptions(it.name)}</select></td>
        <td>${findProduct(it.name)?.useColor === false && !it.spec
          ? '<span class="muted">—</span>'
          : `<select data-f="spec">${colorOptions(it.spec)}</select>`}</td>
        <td><input data-f="qty" type="number" step="any" min="0" class="num" value="${esc(it.qty)}"></td>
        <td><input data-f="unit" value="${esc(it.unit)}" list="units"></td>
        <td><input data-f="price" type="number" step="any" class="num" value="${esc(it.price)}" placeholder="0"></td>
        <td class="c-amt">${num(lineAmount(it))}</td>
        <td class="c-del"><button type="button" class="icon-btn" data-act="del-row" title="この行を削除">✕</button></td>
      </tr>
      ${refInfo && it.ref ? `<tr class="ref-row" data-ref-for="${i}"><td></td><td colspan="7">${refInfo(it)}</td></tr>` : ''}`).join('');
    updateTotals();
  };

  tbody.addEventListener('input', e => {
    const f = e.target.dataset.f;
    const tr = e.target.closest('tr[data-i]');
    if (!f || !tr) return;
    const i = +tr.dataset.i;
    items[i][f] = e.target.value;
    if (f === 'name') {
      // 品名を変えたらマスタの単位・単価を反映
      const p = findProduct(e.target.value);
      if (p) {
        items[i].unit = p.unit;
        if (autoPrice) items[i].price = priceOf ? priceOf(p.name) : p.price;
        if (!p.useColor) items[i].spec = '';
      }
      renderRows();
      return;
    }
    $('.c-amt', tr).textContent = num(lineAmount(items[i]));
    const refRow = $(`tr[data-ref-for="${i}"] td:last-child`, tbody);
    if (refRow && refInfo) refRow.innerHTML = refInfo(items[i]);
    updateTotals();
  });
  root.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'add-row') {
      items.push(blankItem(autoPrice, priceOf));
      renderRows();
      $$('tr[data-i]', tbody).pop().querySelector('[data-f=spec], [data-f=qty]').focus();
    } else if (act === 'del-row') {
      const i = +e.target.closest('tr[data-i]').dataset.i;
      items.splice(i, 1);
      if (!items.length) items.push(blankItem(autoPrice, priceOf));
      renderRows();
    }
  });

  renderRows();
  return {
    get items() { return items; },
    setItems(next) { items = next.length ? next : [blankItem(autoPrice, priceOf)]; renderRows(); },
    refresh: renderRows,
    updateTotals,
  };
}

function bindListFilter(root, extra) {
  const input = $('[data-filter]', root);
  const sel = $('[data-status-filter]', root);
  const billSel = $('[data-billing-filter]', root);
  const showVoid = $('[data-show-void]', root);
  const apply = () => {
    const q = (input?.value || '').trim().toLowerCase();
    const st = sel?.value || '';
    const bill = billSel?.value || '';
    let shown = 0;
    $$('tbody tr[data-search]', root).forEach(tr => {
      const stOk = !st || (st === 'open' ? tr.dataset.status !== 'done' : tr.dataset.status === st);
      const billOk = !bill || tr.dataset.billing === bill;
      const voidOk = !tr.dataset.void || !showVoid || showVoid.checked;
      const ok = (!q || tr.dataset.search.toLowerCase().includes(q)) && stOk && billOk && voidOk;
      tr.hidden = !ok;
      if (ok) shown++;
    });
    const cnt = $('[data-count]', root);
    if (cnt) cnt.textContent = `${shown} 件`;
  };
  input?.addEventListener('input', apply);
  sel?.addEventListener('change', apply);
  billSel?.addEventListener('change', apply);
  showVoid?.addEventListener('change', apply);
  $$('tr.clickable', root).forEach(tr => tr.addEventListener('click', e => {
    if (!e.target.closest('a,button')) go(tr.dataset.href);
  }));
  if (extra) extra();
  apply();
}

function staffOptions(selected) {
  const list = [...db.staff];
  if (selected && !list.includes(selected)) list.push(selected);
  return '<option value="">— 選択 —</option>' + list.map(s => `<option ${s === selected ? 'selected' : ''}>${esc(s)}</option>`).join('');
}

// 追加の受注のつながり（元の受注 parentOrderId）
const parentOf = o => o?.parentOrderId ? getOrder(o.parentOrderId) : null;
const childrenOf = o => db.orders.filter(x => x.parentOrderId === o.id);
// o を元の受注に選べない受注（自分と、自分の追加の受注をたどった先）。つながりが輪にならないように
function orderDescendantIds(o) {
  const ids = new Set([o.id]);
  for (let added = true; added;) {
    added = false;
    db.orders.forEach(x => { if (x.parentOrderId && ids.has(x.parentOrderId) && !ids.has(x.id)) { ids.add(x.id); added = true; } });
  }
  return ids;
}

function viewOrderForm(id, customerParam, prospectParam, parentParam, quoteParam) {
  const editing = id ? getOrder(id) : null;
  if (id && !editing) return notFound();
  const fromQuote = !editing && quoteParam ? getQuote(quoteParam) : null;
  if (fromQuote && (stateOf(fromQuote) !== 'issued' || (fromQuote.orderId && getOrder(fromQuote.orderId)))) {
    return render(`<div class="card empty">この見積書からは受注を登録できません（発行済で、まだ受注になっていない見積書だけが対象です）。<br>
      <a class="btn" href="#/quotes/${fromQuote.id}">見積書の画面へ戻る</a></div>`);
  }
  const pr = !editing && (prospectParam || fromQuote?.prospectId) ? db.prospects.find(x => x.id === (prospectParam || fromQuote.prospectId)) : null;
  const parent = !editing && parentParam ? getOrder(parentParam) : null;
  const o = editing ? clone(editing) : {
    id: uid(), orderNo: nextNo('order'), customerPoNo: '', customerId: getPartner(customerParam) ? customerParam : '', orderDate: today(), dueDate: '',
    answerDate: '', staff: '', billing: '未処理', subject: '', taxRate: db.settings.taxRate, items: [blankItem(true, n => priceFor(customerParam, n))], note: '',
  };
  if (parent) {
    // 追加の受注：お客様・担当・税率・件名を元の受注から引き継ぐ（明細は空から）
    Object.assign(o, {
      parentOrderId: parent.id, customerId: parent.customerId, staff: parent.staff || '', taxRate: parent.taxRate ?? db.settings.taxRate,
      subject: `${parent.orderNo} の追加分${parent.subject ? `（${parent.subject}）` : ''}`,
      items: [blankItem(true, n => priceFor(parent.customerId, n))],
    });
  }
  const excluded = orderDescendantIds(o);
  const parentChoices = db.orders.filter(x => !excluded.has(x.id))
    .sort((a, b) => String(b.orderDate).localeCompare(String(a.orderDate)) || String(b.orderNo).localeCompare(String(a.orderNo)));
  if (fromQuote) {
    // 見積書から受注にする：お客様・件名・担当・税率・明細（単価）を引き継ぐ
    Object.assign(o, {
      customerId: fromQuote.partnerId, subject: fromQuote.subject || '', staff: fromQuote.staff || '', taxRate: fromQuote.taxRate ?? db.settings.taxRate,
      dueDate: pr?.dueDate || '', answerDate: pr?.answerDate || '',
      items: fromQuote.items.map(({ name, spec, qty, unit, price }) => ({ id: uid(), name, spec, qty, unit, price })),
    });
  } else if (pr) {
    // 見込み案件から受注にする：会社名が一致する取引先と、品名・色・数量・納期・担当を引き継ぐ
    const p = findProduct(pr.product);
    Object.assign(o, {
      customerId: db.partners.find(x => x.name === pr.company)?.id || '', dueDate: pr.dueDate || '', answerDate: pr.answerDate || '',
      staff: pr.staff || '', note: pr.note || '',
      items: [{ id: uid(), name: pr.product, spec: pr.color || '', qty: toNum(pr.qty), unit: p?.unit || '個', price: priceFor(db.partners.find(x => x.name === pr.company)?.id, pr.product) }],
    });
  }

  render(`
    <div class="page-head">
      <div><div class="crumb"><a href="#/orders">受注一覧</a> › ${editing ? '編集' : '新規登録'}</div>
        <h1>${editing ? `受注を編集 ${tag(o.orderNo, 'is-order')}` : '新しい受注を登録'}</h1></div>
    </div>
    <form id="doc-form" autocomplete="off">
      <section class="card">
        <h2>番号（紐付けのカギになります）</h2>
        <div class="grid-2">
          <div class="field number-field is-order">
            <label>自社受注No. <span class="req">必須</span></label>
            <input name="orderNo" value="${esc(o.orderNo)}">
            <p class="hint">自動で採番されます。変更もできます。発注書・納品書にもこの番号が入ります。</p>

          <div class="field number-field">

            <input name="customerPoNo" value="${esc(o.customerPoNo)}" placeholder="例：PO-12345">
            <p class="hint">納品書に「貴社発注No.」として印字されます。</p>
          </div>
          <div class="field span-2">
            <label>元の受注No. <span class="opt">（追加の注文のとき）</span></label>
            <select name="parentOrderId"><option value="">— なし —</option>${parentChoices.map(x =>
              `<option value="${x.id}" ${x.id === o.parentOrderId ? 'selected' : ''}>${esc(x.orderNo)}｜${esc(partnerName(x.customerId))}${x.subject ? `｜${esc(x.subject)}` : ''}</option>`).join('')}</select>
            <p class="hint">すでにある受注への追加の注文は、新しい受注として登録し、ここで元の受注を選びます。受注の画面でお互いにたどれます。</p>
          </div>
        </div>
      </section>
      ${parent ? `<div class="banner">受注 ${tag(parent.orderNo, 'is-order')} への追加の注文として、新しい受注を登録します。明細には追加分だけを入力してください。</div>` : ''}
      ${fromQuote ? `<div class="banner">見積書 ${tag(fromQuote.quoteNo, 'is-quote')} の内容（お客様・件名・明細・単価）を引き継いで受注を登録します。お客様の発注No.・納期を入力してください。</div>` : ''}
      ${pr && !fromQuote ? `<div class="banner">見込み案件（${esc(pr.date)}｜${esc(pr.company)}）から受注を登録します。${o.customerId ? '' : '<b>お客様を選択（または「＋ 新規」で登録）してください。</b>'}</div>` : ''}
      <section class="card">
        <h2>受注内容</h2>
        <div class="grid-4">
          <div class="span-2">${partnerSelectField('customerId', 'お客様（注文元）', 'customer', o.customerId)}</div>

      </section>

        <div class="field"><label>メモ・備考 <span class="opt">（社内用）</span></label><textarea name="note">${esc(o.note)}</textarea></div>
      </section>
      <div class="form-actions">
        <a class="btn" href="${editing ? `#/orders/${o.id}` : '#/orders'}">キャンセル</a>

      </div>

  const form = $('#doc-form');

  // お客様を変えたら、単価を変えていない行はそのお客様の単価にする
  let lastCustomer = form.elements.customerId.value;
  form.elements.customerId.addEventListener('change', () => {
    const next = form.elements.customerId.value;
    let changed = 0;
    ed.items.forEach(it => {
      if (!findProduct(it.name) || String(it.price) !== String(priceFor(lastCustomer, it.name))) return;
      const v = priceFor(next, it.name);
      if (String(v) !== String(it.price)) { it.price = v; changed++; }
    });
    lastCustomer = next;
    if (changed) {
      ed.refresh();
      toast('単価をこのお客様の単価にしました');
    }
  });
  form.elements.taxRate.addEventListener('input', ed.updateTotals);
  bindPartnerButtons(form);

  form.addEventListener('submit', e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    f.orderNo = f.orderNo.trim();
    if (!f.orderNo) return toast('自社受注No.を入力してください', 'error');
    if (db.orders.some(x => x.orderNo === f.orderNo && x.id !== o.id)) return toast('この自社受注No.は既に使われています', 'error');
    if (!f.customerId) return toast('お客様を選択してください', 'error');
    const items = cleanItems(ed.items);
    if (!items.length) return toast('明細を1行以上入力してください（品名は必須です）', 'error');

      updatedAt: new Date().toISOString(),
    });

    else delete o.parentOrderId;
    if (editing && o.billing !== editing.billing && !setBillingByHand(o, editing.billing, o.billing)) {
      return toast('保存をやめました（請求書の状況を元に戻すか、確認してからもう一度保存してください）', 'error');
    }
    linkPartnerKind(o.customerId, 'customer');
    if (fromQuote) {
      o.quoteId = fromQuote.id;
      Object.assign(fromQuote, { orderId: o.id, wonAt: nowIso() });
      delete fromQuote.outcome; delete fromQuote.lostReason; delete fromQuote.lostAt;
    }
    if (editing) db.orders[db.orders.indexOf(editing)] = o;
    else db.orders.push({ ...o, createdAt: o.updatedAt });
    if (pr) pr.orderId = o.id;
    save();
    toast('受注を保存しました');
    go(`#/orders/${o.id}`);
  });
}

      追加の注文は、右上の「＋ 追加の受注」から新しい受注として登録してください。</div>` : ''}
    <section class="card">
      <h2>紐付け（受注 → 発注書 → 納品書）</h2>
      ${chainHTML(o, { currentId: o.id })}
      ${next}
    </section>
    <section class="card">
      <h2>受注内容</h2>
      <dl class="info">
        <div><dt>自社受注No.</dt><dd>${tag(o.orderNo, 'is-order')}</dd></div>
        <div><dt>お客様発注No.</dt><dd>${tag(o.customerPoNo, 'is-cust')}</dd></div>
        <div><dt>受注日</dt><dd>${fmtDate(o.orderDate) || '—'}</dd></div>
        <div><dt>担当者</dt><dd>${esc(o.staff) || '—'}</dd></div>
        <div><dt>希望納期</dt><dd>${fmtDate(o.dueDate) || '—'}</dd></div>
        <div><dt>回答納期</dt><dd>${fmtDate(o.answerDate) || '—'}</dd></div>
        <div><dt>納期まで</dt><dd>${dueHTML(o, st)}</dd></div>
        <div><dt>請求書</dt><dd><select data-act="billing" style="width:auto">${Object.keys(BILLING).map(b => `<option ${b === (o.billing || '未処理') ? 'selected' : ''}>${b}</option>`).join('')}</select></dd></div>
        <div class="span-2"><dt>お客様</dt><dd>${partnerLink(o.customerId)} ${cu?.contact ? `<span class="muted">／${esc(cu.contact)}</span>` : ''}</dd></div>
        <div class="span-2"><dt>件名</dt><dd>${esc(o.subject) || '—'}</dd></div>
        ${o.quoteId ? `<div class="span-2"><dt>見積書</dt><dd>${getQuote(o.quoteId) ? quoteTag(getQuote(o.quoteId)) : '<span class="muted">（削除済み）</span>'}</dd></div>` : ''}
        ${o.parentOrderId ? `<div class="span-2"><dt>元の受注</dt><dd>${parent ? `<a href="#/orders/${parent.id}">${tag(parent.orderNo, 'is-order')}</a>` : '<span class="muted">（削除済み）</span>'}</dd></div>` : ''}
        ${children.length ? `<div class="span-2"><dt>追加の受注</dt><dd>${children.map(x => `<a href="#/orders/${x.id}">${tag(x.orderNo, 'is-order')}</a>`).join(' ')}</dd></div>` : ''}

  $('[data-act=billing]').addEventListener('change', e => {
    if (!setBillingByHand(o, o.billing, e.target.value)) {
      e.target.value = o.billing;
      return;
    }
    save();
    toast(`請求書を「${o.billing}」にしました`);
  });
  $('[data-act=delete]').addEventListener('click', () => {
    const docs = [...posOf(o.id), ...dnsOf(o.id)];
    const issued = docs.filter(x => stateOf(x) === 'issued').length;
    if (issued) return alert(`この受注には発行済の発注書・納品書が ${issued} 件あります。\n受注を削除するには、先にそれらを「取消」してください。`);
    const drafts = docs.filter(x => stateOf(x) === 'draft').length;
    const voids = docs.length - drafts;
    if (!confirm(`受注 ${o.orderNo} を削除します。${drafts ? `\n下書きの発注書・納品書 ${drafts} 件も削除します。` : ''}${voids ? `\n取消済の書類 ${voids} 件は控えとして残ります。` : ''}${children.length ? `\n追加の受注 ${children.length} 件は残り、元の受注とのつながりが外れます。` : ''}\nよろしいですか？`)) return;
    db.pos = db.pos.filter(x => !(x.orderId === o.id && stateOf(x) === 'draft'));
    db.deliveries = db.deliveries.filter(x => !(x.orderId === o.id && stateOf(x) === 'draft'));
    db.orders = db.orders.filter(x => x.id !== o.id);
    db.orders.forEach(x => { if (x.parentOrderId === o.id) delete x.parentOrderId; });
    db.prospects.forEach(p => { if (p.orderId === o.id) p.orderId = ''; });
    // 見積書は「提出済」に戻す（受注を登録し直せる）
    db.quotes.forEach(q => { if (q.orderId === o.id) { delete q.orderId; delete q.wonAt; } });
    save();
    toast('受注を削除しました');
    go('#/orders');
  });
}

// ---------- 発注書・納品書 共通 ----------
const DOC = {
  po: { label: '発注書', path: 'pos', noField: 'poNo', dateField: 'poDate', cls: 'is-po', step: '②', list: () => db.pos },
  dn: { label: '納品書', path: 'deliveries', noField: 'dnNo', dateField: 'deliveryDate', cls: 'is-dn', step: '③', list: () => db.deliveries },
  bill: { label: '請求書', path: 'bills', noField: 'billNo', dateField: 'invoiceDate', cls: 'is-inv', step: '④', list: () => db.bills },
  quote: { label: '見積書', path: 'quotes', noField: 'quoteNo', dateField: 'quoteDate', cls: 'is-quote', step: '', list: () => db.quotes },
};
const DOC_TITLE = { po: '発注書', dn: '納品書', inv: '請求書', bill: '請求書', rc: '領収書', quote: '見積書' };
const getDoc = (type, id) => ({ po: getPo, dn: getDn, bill: getBill, quote: getQuote }[type](id));
const nowIso = () => new Date().toISOString();
function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${ymd(d).replace(/-/g, '/')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 書類番号の表示（下書きは番号なし、再発行は「再」、取消は取り消し線）
function docTag(type, d) {
  const T = DOC[type];
  const st = stateOf(d);
  if (st === 'draft') return `<span class="no-tag is-draft">下書き</span>${d.reissueOf ? '<span class="re-mark" title="再発行">再</span>' : ''}`;
  return `<span class="no-tag ${T.cls}${st === 'void' ? ' is-void' : ''}">${esc(d[T.noField])}</span>${d.reissueOf ? '<span class="re-mark" title="再発行">再</span>' : ''}${st === 'void' ? ' <span class="badge st-ng">取消</span>' : ''}`;
}
const stateBadge = d => `<span class="badge ${DOC_STATE[stateOf(d)].cls}">${DOC_STATE[stateOf(d)].label}</span>`;

function addLog(action, type, d, extra = {}) {
  db.logs.push({ id: uid(), at: nowIso(), by: currentUser, action, docType: type, docId: d.id,
    no: extra.no ?? (DOC[type] ? d[DOC[type].noField] : ''), reason: extra.reason || '' });
}

// ---------- 書類の印字内容（発行時に保存し、以後は保存した内容で表示する） ----------
function partnerSnap(id) {
  const p = getPartner(id);
  return p ? { name: p.name, honorific: p.honorific, contact: p.contact, zip: p.zip, address: p.address } : null;
}
const companySnap = () => ({ ...db.settings.company, showLogo: !!db.settings.showLogo });

function buildModel(type, d) {
  if (type === 'bill') return buildBillModel(d);
  const o = d.orderId ? getOrder(d.orderId) : null;
  const t = calc(d);
  const PENDING = '（発行時に採番）';
  const m = {
    type, title: DOC_TITLE[type], to: partnerSnap(type === 'po' ? d.supplierId : type === 'quote' ? d.partnerId : o?.customerId), company: companySnap(),
    items: d.items.map(({ name, spec, qty, unit, price }) => ({ name, spec, qty, unit, price })),
    sum: { sub: t.sub, tax: t.tax, total: t.total, rate: t.rate }, subject: d.subject || '', note: d.note || '', cond: [], reissue: null,
  };
  if (type === 'quote') {
    // 見積書：改訂は「再」の印ではなく、番号の枝番と版で示す
    m.no = d.quoteNo;
    m.meta = [['見積書No.', d.quoteNo || PENDING], ['見積日', fmtDate(d.quoteDate)], ['有効期限', fmtDate(d.validUntil)]];
    if (d.reissueOf) m.meta.push(['改訂', `第${d.version || 2}版`]);
    m.cond = [['納期', d.deliveryTerm || ''], ['支払条件', d.paymentTerms || ''], ['有効期限', fmtDate(d.validUntil)]];
    return m;
  }
  if (type === 'po') {
    m.no = d.poNo;
    m.meta = [['発注No.', d.poNo || PENDING], ['発注日', fmtDate(d.poDate)], ['納期', fmtDate(d.dueDate)], ['当社受注No.', o?.orderNo]];
    m.cond = [['納品場所', d.deliveryPlace || ''], ['支払条件', d.paymentTerms || '']];
  } else {
    m.no = d.dnNo;
    m.meta = [['納品書No.', d.dnNo || PENDING], ['納品日', fmtDate(d.deliveryDate)], ['貴社発注No.', o?.customerPoNo], ['当社受注No.', o?.orderNo]];
    m.dest = [d.shipType === 'stock' ? '貴社在庫への補充分' : '', d.destination || ''].filter(Boolean).join('　');
  }
  const from = d.reissueOf ? getDoc(type, d.reissueOf)?.[DOC[type].noField] : '';
  if (from) {
    m.reissue = { version: d.version || 2, from };
    m.meta.push(['再発行元No.', from]);
  }
  return m;
}

// 発注書・納品書の表示内容：下書きは最新のマスタから、発行後は保存した内容
const docModel = (type, d) => (stateOf(d) === 'draft' || !d.snap ? buildModel(type, d) : d.snap);

    ${c.dept ? `<div class="company-dept">${esc(c.dept)}</div>` : ''}
    ${c.zip || c.address ? `<div>${c.zip ? '〒' + esc(c.zip) + '　' : ''}${esc(c.address)}</div>` : ''}
    ${c.tel || c.fax ? `<div>${c.tel ? 'TEL ' + esc(c.tel) : ''}${c.fax ? '　FAX ' + esc(c.fax) : ''}</div>` : ''}
    ${c.email ? `<div>${esc(c.email)}</div>` : ''}
    ${c.invoiceNo ? `<div>登録番号：${esc(c.invoiceNo)}</div>` : ''}
    ${c.person ? `<div>担当：${esc(c.person)}</div>` : ''}

const metaHTML = m => `<table class="doc-meta">${m.meta.map(([k, v]) => `<tr><th>${k}</th><td>${esc(v || '—')}</td></tr>`).join('')}</table>`;

// state：draft（下書きの透かし）／issued／void（取消の透かし）
function renderDoc(m, state) {
  const wm = state === 'void' ? '<div class="wm wm-void">取 消</div>' : state === 'draft' ? '<div class="wm wm-draft">下書き</div>' : '';
  const re = m.reissue ? `<div class="reissue-stamp" title="再発行（第${m.reissue.version}版）"><b>再</b><small>第${m.reissue.version}版</small></div>` : '';
  return wm + re + (m.type === 'rc' ? receiptBody(m) : m.type === 'bill' ? billBody(m) : docBody(m));
}

        ${metaHTML(m)}
